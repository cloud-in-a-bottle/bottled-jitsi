[app]
name = "jitsi"
version = "0.2.0"
description = "Jitsi Meet video conferencing: XMPP + jicofo + jitsi-videobridge + nginx + jibri (recording) in one container."

[runtime.container]
image = "Dockerfile"
port = 80
# Jibri runs a headless Chrome that captures the meeting; Chrome's
# renderer needs >= 2 GiB of /dev/shm or it OOM-kills mid-recording.
shm_mb = 2048
# /dev/snd: ALSA loopback so jibri can pipe Chrome audio through
# ffmpeg.  CAP_SYS_ADMIN: required by Chromium's headless sandbox
# (creates user/PID/mount namespaces).  Both gated behind the
# privileged opt-in below.
devices = ["/dev/snd"]
capabilities = ["SYS_ADMIN"]

[runtime.security]
# CAP_SYS_ADMIN gives this container effective root inside its
# user namespace.  Operators must accept the warning at deploy time.
privileged = true

# Jitsi Videobridge media port. OpenHost only exposes extra ports in
# the 9000-9999 range, so we pin JVB_PORT=9500 inside the container
# and bind host port 9500/udp publicly. The host also gets 9500/tcp
# which JVB does not use, but there is no harm in it.
[[ports]]
label = "jvb-media"
container_port = 9500
host_port = 9500

[resources]
# Adds ~2 GB for Jibri (Chrome + Xorg + ffmpeg) on top of the
# baseline 3 GiB for JVB/Jicofo/Prosody/nginx.  Bump higher for
# busier rooms or longer recordings.
memory_mb = 5120
cpu_millicores = 3000

[data]
app_data = true
app_temp_data = true

[routing]
health_check = "/"
# The Jitsi web frontend is, by design, publicly accessible: the whole
# point is that random users you give a link to can join a meeting.
# OpenHost's owner auth gate would block them. Expose everything as
# public; Jitsi handles its own access control (room passwords,
# lobbies, optional JWT auth).
public_paths = ["/"]
