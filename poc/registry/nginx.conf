worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    access_log off;
    server {
        listen 80;
        # Avoid stalled end-of-response delivery through the app proxy when
        # several large registry blobs are streamed concurrently.
        keepalive_timeout 0;
        location /v2/ {
            # Publishing is only possible through the internal registry port
            # via an owner's SSH tunnel. No public uploads or deletes.
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
        location / { return 404; }
    }
}
